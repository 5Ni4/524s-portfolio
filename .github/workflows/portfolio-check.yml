name: Portfolio release preflight

'on':
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Verify static release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the verified revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Exercise the release source policy without deployment
        run: |
          set -eu
          verify() { sh scripts/verify-portfolio-release-source.sh "$@"; }
          current=$(git rev-parse HEAD)
          stale=0000000000000000000000000000000000000000
          reject() {
            if verify "$@"; then
              printf '%s\n' 'Expected the simulated release source to be rejected.' >&2
              exit 1
            fi
          }
          verify refs/heads/main "$current" "$current"
          reject refs/heads/main "$stale" "$current"
          reject refs/heads/preview "$current" "$current"
          reject refs/tags/main "$current" "$current"
          reject refs/heads/main "$current" ""
      - name: Build and verify release files (no deployment)
        run: |
          set -eu
          sh scripts/build-portfolio.sh
          for file in index.html styles.css cursor-dots.js design-toggle.js instagram-gallery.js project-badge-hover.js speakerdeck-carousel.js; do
            test -s "dist/$file"
            cmp "$file" "dist/$file"
          done
          diff -qr assets dist/assets
          diff -qr LICENSES dist/LICENSES
          printf 'Verified build source: %s\n' "$(git rev-parse HEAD)"
